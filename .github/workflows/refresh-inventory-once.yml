name: Refresh inventory once

on:
  push:
    branches:
      - ci/docker-nonroot-pip

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/docker-nonroot-pip
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Regenerate final inventory and remove helper
        run: |
          rm .github/workflows/refresh-inventory-once.yml
          python scripts/check_file_inventory.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh inventory for non-root Docker image"
          git push origin HEAD:ci/docker-nonroot-pip
