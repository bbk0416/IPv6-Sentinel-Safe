name: Verify reproducible Docker build

on:
  push:
    branches:
      - fix/docker-reproducible-builds

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify lock and immutable base configuration
        run: python scripts/check_requirements.py
      - name: Install locked test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-container.lock
      - name: Run full tests
        run: python scripts/run_full_tests.py
      - name: Build Docker image
        run: docker build --pull=false -t ipv6-sentinel-safe:reproducible .
      - name: Verify image digest and runtime identity
        run: |
          docker inspect --format='image={{.Id}} user={{.Config.User}}' ipv6-sentinel-safe:reproducible
          test "$(docker inspect --format='{{.Config.User}}' ipv6-sentinel-safe:reproducible)" = "ipv6sentinel"
      - name: Regenerate inventory without helper workflow
        run: |
          rm -f .github/workflows/verify_reproducible_builds.yml
          python scripts/check_file_inventory.py --write
          python scripts/check_requirements.py
          git status --short
          git add -A
          git commit -m "chore: finalize reproducible container build metadata"
          git push
