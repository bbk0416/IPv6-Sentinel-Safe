name: Export release inventory

on:
  pull_request:
    branches: [main]

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 3
      - name: Generate inventory for final CI content
        run: |
          git show HEAD^^:.github/workflows/ci.yml > .github/workflows/ci.yml
          python scripts/check_file_inventory.py --write
      - name: Upload generated inventory
        uses: actions/upload-artifact@v4
        with:
          name: socketio-auth-file-inventory
          path: docs/release/FILE_INVENTORY.json
          if-no-files-found: error
