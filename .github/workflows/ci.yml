name: Export P0-2 release inventory

on:
  pull_request:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/docker-healthcheck-auth-p0
          fetch-depth: 2
      - name: Generate inventory for final CI content
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          python scripts/check_file_inventory.py --write
      - name: Upload generated inventory
        uses: actions/upload-artifact@v4
        with:
          name: docker-healthcheck-auth-file-inventory
          path: docs/release/FILE_INVENTORY.json
