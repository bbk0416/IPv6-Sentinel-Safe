name: Probe README Test Count Guard

on:
  push:
    branches: [ci/readme-test-count-guard]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/readme-test-count-guard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore final-workspace shape
        run: rm .github/workflows/probe-readme-test-count-guard.yml
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Confirm current README count passes
        run: |
          python scripts/run_full_tests.py > /tmp/readme-count-positive.json
          grep -q '"readme_claims_match": true' /tmp/readme-count-positive.json
      - name: Confirm stale README count fails
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = "full unittest discovery: 160 tests passed"
          new = "full unittest discovery: 159 tests passed"
          if old not in text:
              raise SystemExit("expected README test-count claim not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          if python scripts/run_full_tests.py > /tmp/readme-count-negative.json 2> /tmp/readme-count-negative.err; then
            echo "stale README count unexpectedly passed"
            cat /tmp/readme-count-negative.json
            exit 1
          fi
          grep -q 'README test-count mismatch' /tmp/readme-count-negative.err
          grep -q '"readme_claims_match": false' /tmp/readme-count-negative.json
