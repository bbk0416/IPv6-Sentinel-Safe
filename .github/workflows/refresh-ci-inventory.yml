name: Refresh CI Inventory

on:
  push:
    branches: [ci/full-unittest-discovery]

permissions:
  contents: write

jobs:
  refresh-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/full-unittest-discovery
      - name: Generate final-workspace inventory
        run: |
          rm .github/workflows/refresh-ci-inventory.yml
          python scripts/check_file_inventory.py --write
      - name: Commit generated inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/FILE_INVENTORY.json
          git commit -m "Refresh inventory for permanent full-test CI [skip ci]"
          git push origin HEAD:ci/full-unittest-discovery
