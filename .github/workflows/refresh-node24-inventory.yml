name: Refresh Node24 Inventory

on:
  push:
    branches: [ci/node24-actions-v7]

permissions:
  contents: write

jobs:
  refresh-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ci/node24-actions-v7
      - name: Generate final-workspace inventory
        run: |
          rm .github/workflows/refresh-node24-inventory.yml
          python scripts/check_file_inventory.py --write
      - name: Commit generated inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/FILE_INVENTORY.json
          git commit -m "Refresh inventory for Node 24 Actions [skip ci]"
          git push origin HEAD:ci/node24-actions-v7
