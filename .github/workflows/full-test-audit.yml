name: Apply Full-Test Inventory

on:
  push:
    branches: [audit/full-test-count-p0]

permissions:
  contents: write

jobs:
  apply-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-test-count-p0
      - name: Generate final-workspace inventory
        run: |
          rm .github/workflows/full-test-audit.yml
          python scripts/check_file_inventory.py --write
      - name: Commit generated inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/FILE_INVENTORY.json
          git commit -m "Refresh inventory for 160-test README [skip ci]"
          git push origin HEAD:audit/full-test-count-p0
