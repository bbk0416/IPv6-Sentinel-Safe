name: Pretty-refresh release inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2
      - name: Regenerate pretty inventory for final CI
        run: |
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          python scripts/check_file_inventory.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/FILE_INVENTORY.json
          if git diff --cached --quiet; then
            echo "No inventory formatting update required"
            exit 0
          fi
          git commit -m "Format regenerated release inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
