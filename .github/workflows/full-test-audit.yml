name: Export Full-Test Inventory

on:
  push:
    branches: [audit/full-test-count-p0]

jobs:
  export-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match intended final workspace
        run: rm .github/workflows/full-test-audit.yml
      - name: Regenerate release inventory
        run: python scripts/check_file_inventory.py --write
      - name: Upload generated inventory
        uses: actions/upload-artifact@v4
        with:
          name: full-test-count-file-inventory
          path: docs/release/FILE_INVENTORY.json
