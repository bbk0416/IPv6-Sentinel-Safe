name: Temporary frontend supply-chain patch

on:
  push:
    branches:
      - fix/frontend-cdn-sri

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/frontend-cdn-sri

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Patch pinned CDN assets and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          template_path = Path('templates/index.html')
          template = template_path.read_text(encoding='utf-8')
          replacements = {
              '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">':
                  '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" referrerpolicy="no-referrer">',
              '<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">':
                  '<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">',
              '<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>':
                  '<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous" referrerpolicy="no-referrer"></script>',
              '<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>':
                  '<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous" referrerpolicy="no-referrer"></script>',
              '<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>':
                  '<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>',
          }
          for old, new in replacements.items():
              if old not in template:
                  raise SystemExit(f'expected template token not found: {old}')
              template = template.replace(old, new, 1)
          template_path.write_text(template, encoding='utf-8')

          test_path = Path('tests/test_static_safety.py')
          tests = test_path.read_text(encoding='utf-8')
          old = '''    def test_dashboard_has_rest_fallback_for_cdn_failure(self) -> None:\n        dashboard = (ROOT / 'static' / 'dashboard.js').read_text(encoding='utf-8')\n        app_text = (ROOT / 'app.py').read_text(encoding='utf-8')\n        self.assertIn('enterRestFallbackMode', dashboard)\n        self.assertIn('/api/monitoring/start', app_text)\n        self.assertIn('/api/assets/generate', app_text)\n'''
          new = '''    def test_dashboard_has_rest_fallback_for_cdn_failure(self) -> None:\n        dashboard = (ROOT / 'static' / 'dashboard.js').read_text(encoding='utf-8')\n        app_text = (ROOT / 'app.py').read_text(encoding='utf-8')\n        template = (ROOT / 'templates' / 'index.html').read_text(encoding='utf-8')\n        self.assertIn('enterRestFallbackMode', dashboard)\n        self.assertIn('/api/monitoring/start', app_text)\n        self.assertIn('/api/assets/generate', app_text)\n\n        external_tags = re.findall(\n            r'<(?:link|script)\\b[^>]*(?:href|src)="https://[^"]+"[^>]*>',\n            template,\n        )\n        self.assertEqual(len(external_tags), 5)\n        for tag in external_tags:\n            with self.subTest(tag=tag):\n                self.assertRegex(tag, r'integrity="sha(?:384|512)-[^"]+"')\n                self.assertIn('crossorigin="anonymous"', tag)\n                self.assertIn('referrerpolicy="no-referrer"', tag)\n\n        self.assertIn('chart.js@4.5.1/dist/chart.umd.min.js', template)\n        self.assertNotIn('src="https://cdn.jsdelivr.net/npm/chart.js"', template)\n        self.assertIn('https://cdn.socket.io/4.7.5/socket.io.min.js', template)\n'''
          if old not in tests:
              raise SystemExit('expected CDN fallback regression test block not found')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify SRI hashes against live CDN bytes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import urllib.request

          assets = [
              ('https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css', 'sha384', '1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3'),
              ('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css', 'sha512', '9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=='),
              ('https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js', 'sha384', 'ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p'),
              ('https://cdn.socket.io/4.7.5/socket.io.min.js', 'sha384', '2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO'),
              ('https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js', 'sha384', 'jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ'),
          ]
          for url, algo, expected in assets:
              request = urllib.request.Request(url, headers={'User-Agent': 'IPv6-Sentinel-Safe-CI/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read()
              actual = base64.b64encode(hashlib.new(algo, data).digest()).decode('ascii')
              if actual != expected:
                  raise SystemExit(f'SRI mismatch for {url}: expected {expected}, got {actual}')
              print(f'[OK] {algo} {url}')
          PY

      - name: Remove temporary workflow and refresh inventory
        shell: bash
        run: |
          rm .github/workflows/tmp_frontend_supply_chain_patch.yml
          PYTHONDONTWRITEBYTECODE=1 python scripts/check_file_inventory.py --write

      - name: Verify focused and full validation
        shell: bash
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          node --check static/dashboard.js
          python -m unittest tests.test_static_safety.StaticSafetyTests.test_dashboard_has_rest_fallback_for_cdn_failure -v
          python scripts/check_file_inventory.py
          python scripts/release_audit.py
          python scripts/run_full_tests.py

      - name: Commit final branch state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Harden frontend CDN dependencies with SRI"
          git push origin HEAD:fix/frontend-cdn-sri
