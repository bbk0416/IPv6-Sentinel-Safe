name: Refresh README Guard Inventory

on:
  push:
    branches: [ci/readme-test-count-guard]

permissions:
  contents: write

jobs:
  refresh-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/readme-test-count-guard
      - name: Generate final-workspace inventory
        run: |
          rm .github/workflows/refresh-readme-guard-inventory.yml
          python scripts/check_file_inventory.py --write
      - name: Commit generated inventory only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/release/FILE_INVENTORY.json
          git commit -m "Refresh inventory for README test-count guard [skip ci]"
          git push origin HEAD:ci/readme-test-count-guard
