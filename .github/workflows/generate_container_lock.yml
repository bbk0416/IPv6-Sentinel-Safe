name: Generate container dependency lock

on:
  push:
    branches:
      - fix/docker-reproducible-builds

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Resolve and freeze container dependencies
        run: |
          python -m venv .lock-venv
          . .lock-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-container.txt
          python -m pip freeze --all > requirements-container.lock
          python - <<'PY'
          from pathlib import Path
          path = Path("requirements-container.lock")
          lines = [line for line in path.read_text().splitlines() if not line.startswith(("pip==", "setuptools==", "wheel=="))]
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements-container.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: add resolved container dependency lock"
          git push
