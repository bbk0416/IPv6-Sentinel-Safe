name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check requirements manifest
        run: python scripts/check_requirements.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Check frontend syntax
        run: node --check static/dashboard.js
      - name: Verify vendored frontend assets
        run: python scripts/vendor_frontend_assets.py --check
      - name: Run Socket.IO auth regression
        run: python -m unittest tests.test_app_runtime.AppRuntimeTests.test_socketio_requires_same_basic_auth_credentials -v
      - name: Run Docker healthcheck auth regression
        run: python -m unittest tests.test_packaging.PackagingTests.test_docker_healthcheck_uses_env_basic_auth_without_password_cli_arg -v
      - name: Run source and runtime preflight
        run: |
          python scripts/preflight_check.py
          python scripts/preflight_check.py --strict
      - name: Run contract and release checks
        run: |
          python scripts/check_api_contract.py
          python scripts/check_schema_contract.py
          python scripts/check_release_identity.py
          python scripts/check_release_artifact.py
          python scripts/check_file_inventory.py
          python scripts/check_release_matrix.py
          python scripts/check_route_hygiene.py
          python scripts/check_manifest_hygiene.py
          python scripts/check_validation_hygiene.py
          python scripts/check_publication_hygiene.py
          python scripts/check_gate_registry.py
          python scripts/check_capability_boundary.py
          python scripts/check_reviewer_handoff.py
          python scripts/check_release_zip.py
          python scripts/check_ci_workflow.py
      - name: Run release audit
        run: python scripts/release_audit.py
      - name: Run final handoff gate
        run: python scripts/final_handoff_check.py
      - name: Run clean validation
        run: |
          # run_clean_validation.py runs the canonical clean validation gate and cleans generated artifacts.
          python scripts/run_clean_validation.py
      - name: Run full unittest discovery
        run: python scripts/run_full_tests.py
      - name: Build Docker image
        run: docker build -t ipv6-sentinel-safe:test .
      - name: Verify live Docker healthcheck with Basic Auth
        if: matrix.python-version == '3.12'
        run: |
          container_name="ipv6-sentinel-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container_name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          docker run -d --name "$container_name" \
            -e IPV6_SENTINEL_HOST=0.0.0.0 \
            -e IPV6_SENTINEL_WEB_AUTH_ENABLED=1 \
            -e IPV6_SENTINEL_USERNAME=ci-health \
            -e IPV6_SENTINEL_PASSWORD=ci-healthcheck-only \
            ipv6-sentinel-safe:test

          for attempt in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' "$container_name")"
            echo "health attempt ${attempt}: ${status}"
            if [ "$status" = "healthy" ]; then
              docker inspect --format='{{json .State.Health}}' "$container_name"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$container_name"
              docker inspect "$container_name"
              exit 1
            fi
            sleep 2
          done

          docker logs "$container_name"
          docker inspect "$container_name"
          exit 1
