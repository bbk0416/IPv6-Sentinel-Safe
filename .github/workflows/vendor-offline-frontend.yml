name: Prepare offline frontend vendor assets

on:
  push:
    branches: [fix/offline-frontend-vendor]
    paths:
      - .github/workflows/vendor-offline-frontend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/offline-frontend-vendor
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Vendor pinned frontend assets
        run: python scripts/vendor_frontend_assets.py --write
      - name: Switch runtime references to local vendor files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          root = Path('.')
          template_path = root / 'templates' / 'index.html'
          template = template_path.read_text(encoding='utf-8')
          replacements = {
              '<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" referrerpolicy="no-referrer">': '<link href="{{ url_for(\'static\', filename=\'vendor/bootstrap/5.1.3/bootstrap.min.css\') }}" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3">',
              '<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">': '<link href="{{ url_for(\'static\', filename=\'vendor/font-awesome/6.0.0/css/all.min.css\') }}" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==">',
              '<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous" referrerpolicy="no-referrer"></script>': '<script src="{{ url_for(\'static\', filename=\'vendor/bootstrap/5.1.3/bootstrap.bundle.min.js\') }}" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"></script>',
              '<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous" referrerpolicy="no-referrer"></script>': '<script src="{{ url_for(\'static\', filename=\'vendor/socket.io/4.7.5/socket.io.min.js\') }}" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO"></script>',
              '<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" referrerpolicy="no-referrer"></script>': '<script src="{{ url_for(\'static\', filename=\'vendor/chart.js/4.5.1/chart.umd.min.js\') }}" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"></script>',
          }
          for old, new in replacements.items():
              if template.count(old) != 1:
                  raise SystemExit(f'Expected exactly one template reference: {old[:80]}')
              template = template.replace(old, new)
          template_path.write_text(template, encoding='utf-8')

          dashboard_path = root / 'static' / 'dashboard.js'
          dashboard = dashboard_path.read_text(encoding='utf-8')
          old_message = 'Socket.IO 클라이언트 CDN을 사용할 수 없어 REST 폴링 모드로 전환했습니다.'
          new_message = 'Socket.IO 클라이언트를 사용할 수 없어 REST 폴링 모드로 전환했습니다.'
          if dashboard.count(old_message) != 1:
              raise SystemExit('Expected exactly one legacy CDN fallback message')
          dashboard_path.write_text(dashboard.replace(old_message, new_message), encoding='utf-8')

          test_path = root / 'tests' / 'test_static_safety.py'
          tests = test_path.read_text(encoding='utf-8')
          if 'import json\n' not in tests:
              tests = tests.replace('import ast\n', 'import ast\nimport json\n', 1)
          tests = tests.replace("skip_parts = {'.venv', '.testvenv', 'venv', 'env', 'node_modules', '__pycache__'}", "skip_parts = {'.venv', '.testvenv', 'venv', 'env', 'node_modules', '__pycache__', 'vendor'}")
          pattern = re.compile(
              r"    def test_dashboard_has_rest_fallback_for_cdn_failure\(self\) -> None:\n.*?\n    def test_no_wildcard_cors_default",
              re.DOTALL,
          )
          replacement = textwrap.indent(textwrap.dedent('''
          def test_dashboard_uses_only_vendored_frontend_assets_and_rest_fallback(self) -> None:
              dashboard = (ROOT / 'static' / 'dashboard.js').read_text(encoding='utf-8')
              app_text = (ROOT / 'app.py').read_text(encoding='utf-8')
              template = (ROOT / 'templates' / 'index.html').read_text(encoding='utf-8')
              self.assertIn('enterRestFallbackMode', dashboard)
              self.assertIn('/api/monitoring/start', app_text)
              self.assertIn('/api/assets/generate', app_text)
              self.assertNotIn('클라이언트 CDN', dashboard)

              external_tags = re.findall(
                  r'<(?:link|script)\\b[^>]*(?:href|src)="https://[^"]+"[^>]*>',
                  template,
              )
              self.assertEqual(external_tags, [])

              expected_vendor_assets = [
                  'vendor/bootstrap/5.1.3/bootstrap.min.css',
                  'vendor/font-awesome/6.0.0/css/all.min.css',
                  'vendor/bootstrap/5.1.3/bootstrap.bundle.min.js',
                  'vendor/socket.io/4.7.5/socket.io.min.js',
                  'vendor/chart.js/4.5.1/chart.umd.min.js',
              ]
              for relative in expected_vendor_assets:
                  with self.subTest(relative=relative):
                      self.assertIn(f"filename='{relative}'", template)
                      self.assertTrue((ROOT / 'static' / relative).is_file())
              self.assertEqual(template.count('integrity="sha'), 5)

              manifest_path = ROOT / 'static' / 'vendor' / 'VENDOR_MANIFEST.json'
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              paths = {str(item['path']) for item in manifest['assets']}
              self.assertTrue(any(path.startswith('font-awesome/6.0.0/webfonts/') for path in paths))
              self.assertIn('licenses/bootstrap-5.1.3-LICENSE.txt', paths)
              self.assertIn('licenses/socket.io-client-4.7.5-LICENSE.txt', paths)
              self.assertIn('licenses/chart.js-4.5.1-LICENSE.md', paths)
              self.assertIn('licenses/font-awesome-free-6.0.0-LICENSE.txt', paths)

          def test_no_wildcard_cors_default
          ''').strip('\n'), '    ')
          tests, count = pattern.subn(replacement, tests, count=1)
          if count != 1:
              raise SystemExit(f'Expected one CDN regression test block, replaced {count}')
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Verify offline vendor state
        run: |
          python scripts/vendor_frontend_assets.py --check
          node --check static/dashboard.js
          python -m unittest tests.test_static_safety.StaticSafetyTests.test_dashboard_uses_only_vendored_frontend_assets_and_rest_fallback -v
      - name: Check diff
        run: git diff --check
      - name: Commit generated vendor assets and source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/vendor templates/index.html static/dashboard.js tests/test_static_safety.py
          git commit -m "Vendor frontend dependencies for offline runtime"
          git push origin HEAD:fix/offline-frontend-vendor
